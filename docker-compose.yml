services:
  db:
    image: postgres:16
    container_name: odoo-clinic-db
    environment:
      - POSTGRES_USER=odooclinic
      - POSTGRES_PASSWORD=odooclinic
      - POSTGRES_DB=odoo-clinic
    volumes:
      - odoo-clinic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odooclinic -d odoo-clinic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: odoo:18
    container_name: odoo-clinic-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9103:8069"
    volumes:
      - odoo-clinic-web-data:/var/lib/odoo
      # Medical modules (this repo)
      - ./woow_medical_patient:/mnt/extra-addons/woow_medical_patient
      - ./woow_medical_physician:/mnt/extra-addons/woow_medical_physician
      - ./woow_medical_record:/mnt/extra-addons/woow_medical_record
      # Loyalty / Consignment card modules
      - ../Woow_odoo_loyalty_card_enhance/addons/woow_loyalty_consign:/mnt/extra-addons/woow_loyalty_consign
      - ../Woow_odoo_loyalty_card_enhance/addons/woow_loyalty_consign_pos:/mnt/extra-addons/woow_loyalty_consign_pos
      - ../Woow_odoo_loyalty_card_enhance/addons/woow_member_center:/mnt/extra-addons/woow_member_center
      - ../Woow_odoo_loyalty_card_enhance/addons/woow_mc_consign:/mnt/extra-addons/woow_mc_consign
      - ../Woow_odoo_loyalty_card_enhance/addons/woow_consign_booking:/mnt/extra-addons/woow_consign_booking
      # Reservation module
      - ../Odoo_reservation_module/reservation_module:/mnt/extra-addons/reservation_module
      # Survey portal module
      - ../Woow_dev_website_survey_portal:/mnt/extra-addons/woow_dev_website_survey_portal
      # Config
      - ./config/odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped

volumes:
  odoo-clinic-db-data:
  odoo-clinic-web-data:
